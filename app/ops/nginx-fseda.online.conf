# fseda.online – managed by fseda-platform/ops (installed by server-setup.sh).
# Certificate paths are the ones Certbot created with:
#   certbot --nginx -d fseda.online -d www.fseda.online

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name fseda.online www.fseda.online;
    return 301 https://fseda.online$request_uri;
}

# www -> apex, so the login cookie always lives on one host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fseda.online;

    ssl_certificate     /etc/letsencrypt/live/fseda.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fseda.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fseda.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fseda.online;

    ssl_certificate     /etc/letsencrypt/live/fseda.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fseda.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/fseda.online/html;
    index index.html;

    access_log /var/log/nginx/fseda.online.access.log;
    error_log  /var/log/nginx/fseda.online.error.log;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Security headers. Locations below must not use add_header themselves,
    # or Nginx drops these (caching therefore uses "expires").
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Single-page app: unknown paths load index.html, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        expires -1;
    }

    # Versioned build output: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Node.js API (fseda-api.service)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
